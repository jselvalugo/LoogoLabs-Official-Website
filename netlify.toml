[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Every route in src/lib/seo.js is written to disk as a real HTML file by
# scripts/generate-seo-assets.mjs, so the site no longer needs a catch-all
# rewrite. Netlify serves 404.html with a genuine 404 for anything else —
# previously every typo'd URL returned the homepage with a 200, which search
# engines read as a duplicate of the homepage.
#
# Posts are the exception: one can be published from /admin without a rebuild,
# so its slug has no static file yet. Netlify serves an existing static file
# straight from disk without even considering this rule (no `force`), so it only
# fires for a slug that is not in the last build — which render-post.js server-
# renders from the live database: real title, description, canonical, JSON-LD,
# and article text, not a JS-only shell waiting on the next deploy.
[[redirects]]
  from = "/news/*"
  to = "/.netlify/functions/render-post"
  status = 200

# Same problem, for the crawl files instead of a single post: a post published
# from /admin needs to show up in the sitemap, the feed, and llms.txt before the
# next deploy, not after it. These force past the static copies the build writes
# (which stay as the fallback for a host running this repo without functions) and
# read the live posts table instead. `type` tells the one function which of the
# three to build; each sets its own Content-Type and Cache-Control.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/crawl?type=sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/rss.xml"
  to = "/.netlify/functions/crawl?type=rss"
  status = 200
  force = true

[[redirects]]
  from = "/llms.txt"
  to = "/.netlify/functions/crawl?type=llms"
  status = 200
  force = true

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# robots.txt does not depend on the post list, so the static copy from the build
# is both correct and cheaper — no function needed.
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

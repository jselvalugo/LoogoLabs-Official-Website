[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Every route in src/lib/seo.js is written to disk as a real HTML file by
# scripts/generate-seo-assets.mjs, so the site no longer needs a catch-all
# rewrite. Netlify serves 404.html with a genuine 404 for anything else —
# previously every typo'd URL returned the homepage with a 200, which search
# engines read as a duplicate of the homepage.
#
# Posts are the exception: one can be published from /admin without a rebuild,
# so its slug has no file yet. Fall those through to the app, which fetches the
# post and marks the page noindex if the slug really does not exist.
# The CRM app (crm.html) owns every path on crm.loogolabs.com. Static assets
# and functions are passed through first, because a forced rule would otherwise
# shadow them too. /crm on the main domain serves the same app (handy before DNS
# is live and for local preview).
[[redirects]]
  from = "https://crm.loogolabs.com/assets/*"
  to = "/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://crm.loogolabs.com/fonts/*"
  to = "/fonts/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://crm.loogolabs.com/.netlify/*"
  to = "/.netlify/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://crm.loogolabs.com/admin-logo.png"
  to = "/admin-logo.png"
  status = 200
  force = true

[[redirects]]
  from = "https://crm.loogolabs.com/favicon.svg"
  to = "/favicon.svg"
  status = 200
  force = true

[[redirects]]
  from = "https://crm.loogolabs.com/*"
  to = "/crm.html"
  status = 200
  force = true

[[redirects]]
  from = "/crm/*"
  to = "/crm.html"
  status = 200

[[redirects]]
  from = "/crm"
  to = "/crm.html"
  status = 200

# Pricing is withdrawn while plans are reworked; send old links home rather
# than to a 404.
[[redirects]]
  from = "/pricing"
  to = "/"
  status = 302

# Posts are written in English only. /es/news/<slug> serves the same post with
# the Spanish site chrome; its canonical points at the English URL.
[[redirects]]
  from = "/es/news/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/news/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Crawl files change with every publish; do not let a CDN pin a stale sitemap.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/rss.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/rss+xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/crm.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/park-supply"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/branding"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/consulting"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/brand-design"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

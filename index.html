:root {
  --font-display: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}

:root {
  /* Base — deep slate ink */
  --ink-900: #0B0F12;
  --ink-800: #12181F;
  --ink-700: #1B232C;
  --ink-600: #2A343F;
  --ink-500: #3D4A57;
  --ink-400: #5C6A76;
  --ink-300: #8695A1;
  --ink-200: #B4C0C8;
  --ink-100: #D9E1E5;

  /* Base — cool white paper */
  --paper-000: #FFFFFF;
  --paper-100: #F5F7F8;
  --paper-200: #E7ECEE;

  /* Signal — electric cyan. One accent, used sparingly and loudly. */
  --cyan-500: #00E5FF;
  --cyan-600: #00B8CC;
  --cyan-700: #007D8C;
  --cyan-100: #CFF9FF;

  /* Semantic status */
  --status-ok: #2FD07E;
  --status-warn: #FFB000;
  --status-danger: #FF4A3D;

  /* Semantic aliases — prefer these in components */
  --surface-page: var(--paper-100);
  --surface-card: var(--paper-000);
  --surface-sunken: var(--paper-200);
  --surface-inverse: var(--ink-900);
  --surface-inverse-card: var(--ink-800);
  --surface-accent: var(--cyan-500);

  --text-primary: var(--ink-900);
  --text-secondary: var(--ink-400);
  --text-muted: var(--ink-300);
  --text-on-accent: var(--ink-900);
  --text-on-inverse: var(--paper-100);
  --text-on-inverse-secondary: var(--ink-300);
  --text-link: var(--cyan-700);
  --text-link-inverse: var(--cyan-500);

  --border-hair: rgba(11, 15, 18, 0.12);
  --border-strong: var(--ink-900);
  --border-hair-inverse: rgba(245, 247, 248, 0.16);
  --border-accent: var(--cyan-500);

  --focus-ring: var(--cyan-500);
}

:root {
  /* Display — tight, loud, negative tracking */
  --fs-display-1: 88px;  --lh-display-1: 0.92; --ls-display-1: -0.04em;
  --fs-display-2: 64px;  --lh-display-2: 0.94; --ls-display-2: -0.035em;
  --fs-display-3: 48px;  --lh-display-3: 1.00; --ls-display-3: -0.03em;

  /* Headings */
  --fs-h1: 36px; --lh-h1: 1.08; --ls-h1: -0.025em;
  --fs-h2: 28px; --lh-h2: 1.15; --ls-h2: -0.02em;
  --fs-h3: 22px; --lh-h3: 1.25; --ls-h3: -0.015em;

  /* Body */
  --fs-body-lg: 18px; --lh-body-lg: 1.55;
  --fs-body: 16px;    --lh-body: 1.6;
  --fs-body-sm: 14px; --lh-body-sm: 1.5;

  /* Mono utility — labels, eyebrows, data, code */
  --fs-label: 12px;  --lh-label: 1.2;  --ls-label: 0.12em;
  --fs-micro: 11px;  --lh-micro: 1.2;  --ls-micro: 0.1em;
  --fs-data: 14px;   --lh-data: 1.4;   --ls-data: 0;

  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;
}

:root {
  --space-0: 0px;
  --space-1: 2px;
  --space-2: 4px;
  --space-3: 8px;
  --space-4: 12px;
  --space-5: 16px;
  --space-6: 24px;
  --space-7: 32px;
  --space-8: 48px;
  --space-9: 64px;
  --space-10: 96px;
  --space-11: 128px;

  /* Layout */
  --container-max: 1240px;
  --container-narrow: 760px;
  --gutter: var(--space-6);
  --section-y: var(--space-10);
  --grid-columns: 12;
}

:root {
  /* Radii — near-square. Retro-computing precision, not soft SaaS. */
  --radius-0: 0px;
  --radius-1: 2px;
  --radius-2: 4px;
  --radius-3: 8px;
  --radius-pill: 999px;

  --border-width-hair: 1px;
  --border-width-strong: 2px;

  /* Hard offset shadow — the loud one, for primary surfaces and buttons */
  --shadow-hard: 4px 4px 0 var(--ink-900);
  --shadow-hard-sm: 2px 2px 0 var(--ink-900);
  --shadow-hard-accent: 4px 4px 0 var(--cyan-500);
  /* Soft elevation — overlays, menus, toasts only */
  --shadow-soft-1: 0 1px 2px rgba(11, 15, 18, 0.08);
  --shadow-soft-2: 0 8px 24px rgba(11, 15, 18, 0.12);

  /* Motion — short, mechanical, no bounce */
  --dur-fast: 90ms;
  --dur-base: 160ms;
  --dur-slow: 280ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --ease-exit: cubic-bezier(0.4, 0, 1, 1);

  /* Textures */
  --grid-line: rgba(11, 15, 18, 0.07);
  --grid-line-inverse: rgba(245, 247, 248, 0.08);
  --grid-size: 32px;
  --scanline-inverse: rgba(0, 229, 255, 0.05);
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--surface-page);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  text-wrap: pretty;
}

a { color: var(--text-link); text-decoration: none; border-bottom: 1px solid var(--border-accent); }
a:hover { color: var(--ink-900); background: var(--cyan-100); }

/* Utility surfaces used across cards, kits and slides */
.ll-eyebrow {
  font-family: var(--font-mono);
  font-size: var(--fs-label);
  line-height: var(--lh-label);
  letter-spacing: var(--ls-label);
  text-transform: uppercase;
  color: var(--text-secondary);
}
.ll-grid-bg {
  background-image:
    linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
  background-size: var(--grid-size) var(--grid-size);
}
.ll-grid-bg--inverse {
  background-image:
    linear-gradient(to right, var(--grid-line-inverse) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-line-inverse) 1px, transparent 1px);
  background-size: var(--grid-size) var(--grid-size);
}

</style>

<script type="text/loogo-src" data-path="components/core/Button.jsx">
;(function(){

const sizes = {
  sm: { padding: '7px 12px', fontSize: 13 },
  md: { padding: '10px 16px', fontSize: 14 },
  lg: { padding: '14px 22px', fontSize: 16 },
};

function Button({
  children, variant = 'primary', size = 'md', disabled = false,
  fullWidth = false, iconRight, onClick, type = 'button', style, ...rest
}) {
  const [pressed, setPressed] = React.useState(false);
  const [hover, setHover] = React.useState(false);
  const s = sizes[size] || sizes.md;

  const base = {
    fontFamily: 'var(--font-body)',
    fontWeight: 600,
    letterSpacing: '-0.005em',
    lineHeight: 1.2,
    borderRadius: 'var(--radius-2)',
    display: fullWidth ? 'flex' : 'inline-flex',
    width: fullWidth ? '100%' : undefined,
    alignItems: 'center', justifyContent: 'center', gap: 8,
    cursor: disabled ? 'not-allowed' : 'pointer',
    opacity: disabled ? 0.4 : 1,
    transition: 'background var(--dur-fast) var(--ease-standard), box-shadow var(--dur-fast) var(--ease-standard), transform var(--dur-fast) var(--ease-standard), color var(--dur-fast) var(--ease-standard)',
    ...s,
  };

  const variants = {
    primary: {
      background: hover && !disabled ? 'var(--cyan-100)' : 'var(--cyan-500)',
      color: 'var(--ink-900)',
      border: '2px solid var(--ink-900)',
      boxShadow: pressed ? 'none' : 'var(--shadow-hard-sm)',
      transform: pressed ? 'translate(2px, 2px)' : 'none',
    },
    secondary: {
      background: hover && !disabled ? 'var(--paper-200)' : 'var(--paper-000)',
      color: 'var(--ink-900)',
      border: '2px solid var(--ink-900)',
      boxShadow: pressed ? 'none' : 'var(--shadow-hard-sm)',
      transform: pressed ? 'translate(2px, 2px)' : 'none',
    },
    ghost: {
      background: hover && !disabled ? 'var(--paper-200)' : 'transparent',
      color: 'var(--ink-900)',
      border: '1px solid var(--border-hair)',
    },
    inverse: {
      background: hover && !disabled ? 'var(--ink-700)' : 'var(--ink-900)',
      color: 'var(--paper-100)',
      border: '2px solid var(--ink-900)',
      boxShadow: pressed ? 'none' : '2px 2px 0 var(--cyan-500)',
      transform: pressed ? 'translate(2px, 2px)' : 'none',
    },
  };

  return (
    <button
      type={type} disabled={disabled} onClick={disabled ? undefined : onClick}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => { setHover(false); setPressed(false); }}
      onMouseDown={() => setPressed(true)}
      onMouseUp={() => setPressed(false)}
      style={{ ...base, ...variants[variant], ...style }}
      {...rest}
    >
      {children}
      {iconRight ? <span style={{ display: 'inline-flex' }}>{iconRight}</span> : null}
    </button>
  );
}

window.Button = Button;
})();
</script>

<script type="text/loogo-src" data-path="components/core/IconButton.jsx">
;(function(){

function IconButton({ children, label, size = 'md', variant = 'ghost', onClick, style, ...rest }) {
  const [hover, setHover] = React.useState(false);
  const box = size === 'sm' ? 28 : size === 'lg' ? 44 : 36;
  const variants = {
    ghost: { background: hover ? 'var(--paper-200)' : 'transparent', border: '1px solid transparent', color: 'var(--ink-900)' },
    outline: { background: hover ? 'var(--paper-200)' : 'var(--paper-000)', border: '1px solid var(--border-hair)', color: 'var(--ink-900)' },
    inverse: { background: hover ? 'var(--ink-700)' : 'transparent', border: '1px solid var(--border-hair-inverse)', color: 'var(--paper-100)' },
  };
  return (
    <button aria-label={label} title={label} onClick={onClick}
      onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{ width: box, height: box, display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
        borderRadius: 'var(--radius-2)', cursor: 'pointer', padding: 0,
        transition: 'background var(--dur-fast) var(--ease-standard)', ...variants[variant], ...style }}
      {...rest}>{children}</button>
  );
}

window.IconButton = IconButton;
})();
</script>

        <Placeholder label="RELEASE IMAGE — SUPPLY REAL ASSET" height={280} style={{ margin: '28px 0' }} />
        <p style={{ fontSize: 'var(--fs-body)', lineHeight: 'var(--lh-body)' }}>{p.body}</p>
        <h2 style={{ fontSize: 'var(--fs-h2)', letterSpacing: 'var(--ls-h2)', marginTop: 36 }}>What shipped</h2>
        <div style={{ display: 'grid', gap: 0, marginTop: 16 }}>
          {p.rows.map(([k, v]) => (
            <div key={k} style={{ display: 'grid', gridTemplateColumns: '140px 1fr', gap: 16, padding: '14px 0', borderTop: '1px solid var(--border-hair)' }}>
              <span className="ll-eyebrow">{k}</span>
              <span style={{ fontSize: 'var(--fs-body-sm)', lineHeight: 'var(--lh-body-sm)', color: 'var(--ink-600)' }}>{v}</span>
            </div>
          ))}
        </div>
        <Callout tone="neutral" title="Availability" style={{ marginTop: 28 }}>{p.availability}</Callout>
      </article>
    </div>
  );
}

window.LaunchPost = LaunchPost; window.Post = Post;
})();
</script>

<script type="text/loogo-src" data-path="app">
function App(){
  const [page,setPage] = React.useState('Home');
  const nav = ['Home','Mission','Products','Pricing','Launch'];
  let body;
  if (page === 'Home') body = <Home onNavigate={setPage} />;
  else if (page === 'Mission') body = <Mission onNavigate={setPage} />;
  else if (page === 'Products') body = <Products onNavigate={setPage} />;
  else if (page === 'Pricing') body = <Pricing />;
  else if (page === 'Launch') body = <LaunchPost />;
  else body = <ProductPage product={page.replace('product:','')} onNavigate={setPage} />;
  const activeNav = page.startsWith('product:') ? 'Products' : page;
  return <div>
    <NavBar items={nav} active={activeNav} onNavigate={setPage}
      cta={<Button size="sm" variant="primary" onClick={()=>setPage('Mission')}>Talk to us</Button>} />
    <div onClick={e=>{ if(e.target.closest('a') && !e.target.closest('nav')) e.preventDefault(); }}>{body}</div>
    <Footer note="Applied AI for records that were never designed to be read."
      columns={[
        {title:'Products',links:['Loogo Underwrite','Loogo Tee','Loogo Cask']},
        {title:'Company',links:['Mission','Careers','Press','Contact']},
        {title:'Resources',links:['Model cards','Launch notes','Status','Security']}]} />
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
(function(){
  var parts = [], nodes = document.querySelectorAll('script[type="text/loogo-src"]');
  for (var i = 0; i < nodes.length; i++) parts.push(nodes[i].textContent);
  var code = Babel.transform(parts.join('\n'), { presets: [['react', { runtime: 'classic' }]] }).code;
  (0, eval)(code);
})();
</script>
